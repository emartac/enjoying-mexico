<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Sistema de Reservaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #C94488 0%, #7a2a55 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card { width: 100%; max-width: 400px; border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .login-header { background: linear-gradient(135deg, #C94488, #a8336f); border-radius: 16px 16px 0 0; padding: 32px 24px 24px; text-align: center; color: white; }
    .login-header h1 { font-size: 1.4rem; margin: 8px 0 4px; }
    .login-header p  { opacity: .85; font-size: .9rem; margin: 0; }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <i class="bi bi-airplane-fill fs-2"></i>
      <h1>Enjoying México</h1>
      <p>Sistema de Reservaciones — Acceso interno</p>
    </div>
    <div class="card-body p-4">
      {% if form.errors %}
      <div class="alert alert-danger py-2 small">
        Usuario o contraseña incorrectos. Intenta de nuevo.
      </div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" id="id_username" class="form-control"
              autofocus autocomplete="username" required placeholder="Tu nombre de usuario">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="id_password" class="form-control"
              autocomplete="current-password" required placeholder="••••••••">
          </div>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
        </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
